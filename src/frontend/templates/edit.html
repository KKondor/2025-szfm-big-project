{% extends "base.html" %}

{% block title %}Edit {{ food.name }}{% endblock %}

{% block head %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/edit.css') }}">
{% endblock %}

{% block content %}
<!--Módosítja az ételt-->
<section class="edit-food-container">
  <h2>Edit Food: {{ food.name }}</h2>

  <form class="edit-food-form" id="edit-food-form" enctype="multipart/form-data">
    <div class="form-group">
      <label for="food-name">Name</label>
      <input id="food-name" name="name" type="text" value="{{ food.name }}" required>
    </div>

    <div class="form-group">
      <label for="food-description">Description</label>
      <textarea id="food-description" name="description" rows="3">{{ food.description }}</textarea>
    </div>

    <div class="form-group">
      <label for="food-image">Image</label>
      <input type="file" id="food-image" name="food-image" accept="image/*" value="{{ food.image }}">
      <input type="hidden" id="old-image" value="{{ food.image }}">
      <img src="{{ url_for('static', filename='images/' ~ food.image) }}" alt="{{ food.name }}" class="preview-image">
    </div>

    <div class="form-group">
      <label for="food-price">Price (Ft)</label>
      <input id="food-price" name="price" type="number" step="1" value="{{ food.price }}" required>
    </div>

    <div class="form-group">
      <label for="food-category">Category</label>
      <input id="food-category" name="category" type="text" value="{{ food.category }}">
    </div>

    <div class="form-buttons">
      <button type="submit" class="save-btn">Save Changes</button>
      <a href="{{ url_for('api.api_delete_food', food_id=food.id) }}" class="delete-btn">Delete Food</a>
    </div>
  </form>

  <a href="{{ url_for('main.item_list', filename = 'item-list.html') }}" class="back-link">← Back to list</a>
</section>
<script>
  //Ezt ki lehet tolni egy külső js-re
const form = document.querySelector("#edit-food-form");
form.addEventListener("submit", async (e) => {
    e.preventDefault();

    const formData = new FormData(form); // automatically includes files
    //ENNEK VISZONT A HTML-BEN KELL LENNIE
    const foodId = "{{ food.id }}";

    try {
        const res = await fetch(`/api/foods/files/${foodId}`, {
            method: "PUT",
            body: formData
        });

        const data = await res.json();

        if (!res.ok || !data.success) {
            throw new Error(data.message || "Failed to update food");
        }

        alert("Food updated successfully.");
        window.location.href = "{{ url_for('main.item_list') }}";
    } catch (err) {
        console.error("Error updating food:", err);
        alert("Error updating food: " + err.message);
    }
});
</script>
{% endblock %}
