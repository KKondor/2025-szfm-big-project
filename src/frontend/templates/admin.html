{% extends "base.html" %}

{% block title %}Admin Panel{% endblock %}

{% block head %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}">
{% endblock %}

{% block content %}
<section class="admin-container">
    <h2>Admin Dashboard</h2>

    <div class="admin-tabs">
        <button class="tab-btn active" data-target="add-item">Add Item</button>
        <button class="tab-btn" data-target="manage-users">Manage Users</button>
        <button class="tab-btn" data-target="view-orders">View Orders</button>
    </div>

    <div class="admin-sections">
        <!-- Add Item -->
        <!--Az új ételt feltölteni a backendre. Tip Az image itt úgy lesz hogy lementi a static imagesbe és az adatbázisra csak a nevét menti le (food.jpg)-->
        <div class="admin-section active" id="add-item">
            <h3>Add New Menu Item</h3>

            <form class="admin-form" enctype="multipart/form-data">

                <label for="name">Name</label>
                <input type="text" id="name" name="name" placeholder="Item name" required>

                <label for="price">Price</label>
                <input type="number" id="price" name="price" step="0.01" placeholder="Item price" required>

                <label for="description">Description</label>
                <textarea id="description" name="description" placeholder="Short description" rows="3"
                    required></textarea>

                <label for="type">Type</label>
                <select id="type" name="type" required>
                    <option value="" disabled selected>Select type</option>
                    <option value="burger">Burger</option>
                    <option value="pizza">Pizza</option>
                    <option value="drink">Drink</option>
                    <option value="dessert">Dessert</option>
                    <option value="side">Side</option>
                </select>

                <label for="image">Image</label>
                <input type="file" id="image" name="image" accept="image/*" required>

                <button class="btn">Add Item</button>
            </form>
        </div>

        <!-- Manage Users -->
        <!--Meg kell jeleníteni a felhasználók listáját (maybe lazyloadingal), frissíteni a role-t-->
        <div class="admin-section" id="manage-users">
            <h3>Manage Users</h3>
            <table class="admin-table">
                <thead>
                    <tr>
                        <th>User ID</th>
                        <th>Name</th>
                        <th>Role</th>
                    </tr>
                </thead>
                <tbody>

                </tbody>
            </table>
        </div>


        <!-- View Orders -->
        <!--Hasonlóan csak megjeleníted az ordereket és updateled ha változtat az admin.-->
        <div class="admin-section" id="view-orders">
            <h3>View Orders</h3>

            <div class="orders-list">

            </div>
        </div>

    </div>
</section>
<script src="{{ url_for('static', filename='script/admin.js') }}"></script>
{% endblock %}
