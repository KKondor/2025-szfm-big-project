{% extends "base.html" %}

{% block title %}Items{% endblock %}

{% block head %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/item-list.css') }}">
{% endblock %}

{% block body %}
<!--Itt a userhez tartozó foodokat jeleníti meg-->
<aside id="basket-sidebar" class="basket-sidebar active">
  <h2>Your Basket</h2>
  <div class="basket-items">
    <div class="basket-item">
      <img src="{{ url_for('static', filename='images/food.jpg') }}" alt="Dish">
      <div class="basket-info">
        <h3>Pizza Margherita</h3>
        <div class="basket-details">
          <span class="basket-amount">x1</span>
          <span class="basket-price">$12.00</span>
        </div>
      </div>
      <button class="remove-btn" aria-label="Remove item">&times;</button>
    </div>
  </div>
  <div class="basket-total">
    <span>Total:</span>
    <span>$24.00</span>
  </div>
  <button class="checkout-btn">Checkout</button>
</aside>
{% endblock %}

{% block content %}
<!--Leolvassa az összes féle typeot a backendről és azok lesznek az optionok. Le filtereli az item listát csak a typeba eső foodokkal-->
<div class="filter-bar">
    <label for="food-type">Filter by type:</label>
    <select id="food-type" name="food-type">
      <option value="all">All</option>
      <option value="pizza">Pizza</option>
      <option value="pasta">Pasta</option>
      <option value="burger">Burger</option>
      <option value="salad">Salad</option>
    </select>
  </div>
<!--Felsorolja (lazyloadinggal) a foodokat. Az első példa az amit használni kéne templatenek-->
<div class="item-list">
</div>
<script src="{{ url_for('static', filename='script/item-list.js') }}"></script>
{% endblock %}
