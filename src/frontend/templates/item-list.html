{% extends "base.html" %}

{% block title %}Items{% endblock %}

{% block head %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/item-list.css') }}">
{% endblock %}

{% block body %}
{% if is_admin %}
  <input type="hidden" id="is-admin" value="true">
{% endif %}
<!--Itt a userhez tartozó foodokat jeleníti meg-->
<aside id="basket-sidebar" class="basket-sidebar active">
  <h2>Your Basket</h2>
  <div class="basket-items">
  </div>
  <div class="basket-total">
    <span>Total:</span>
    <span></span>
  </div>
  <button class="checkout-btn">Checkout</button>
</aside>
{% endblock %}

{% block content %}
<!--Leolvassa az összes féle typeot a backendről és azok lesznek az optionok. Le filtereli az item listát csak a typeba eső foodokkal-->
<div class="filter-bar">
  <div class="filter-group">
    <label for="food-type">Filter by type:</label>
    <select id="food-type" name="food-type">
      <option value="all">All</option>
      <option value="pizza">Pizza</option>
      <option value="pasta">Pasta</option>
      <option value="burger">Burger</option>
      <option value="salad">Salad</option>
    </select>
    </div>
    <input
      type="text"
      id="food-search"
      placeholder="Search items..."
      autocomplete="off"
    >
  </div>
<!--Felsorolja (lazyloadinggal) a foodokat. Az első példa az amit használni kéne templatenek-->
<div class="item-list">
</div>
<script src="{{ url_for('static', filename='script/item-list.js') }}"></script>
{% endblock %}
